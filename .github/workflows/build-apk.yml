name: Build Orbit APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extract the uploaded project ZIP into the repository root.
      - name: Extract Orbit project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'orbit-debug-apk.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "No project ZIP found in the repository root. Upload the Orbit project ZIP first."
            exit 1
          fi
          mkdir -p /tmp/orbit-unpacked
          unzip -q "$ARCHIVE" -d /tmp/orbit-unpacked
          PROJECT_DIR="$(find /tmp/orbit-unpacked -type f -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find package.json inside the uploaded ZIP."
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
